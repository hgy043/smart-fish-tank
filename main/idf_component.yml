## 本工程使用 ESP-IDF 组件管理器
## 说明：这里锁定的是**用户已验证可运行**的版本 —— 见
##       xiaozhi-esp32-1.9.4-gec/managed_components/espressif__esp_codec_dev
## 若构建环境离线导致拉取失败，可改为把该目录直接复制到
## smart-fish-tank/components/espressif__esp_codec_dev（去掉 idf_component.yml 即可自包含）。
dependencies:
  idf:
    version: '>=5.3'
  espressif/esp_codec_dev:
    version: '~1.4.0'

  # ==========================================================================
  # LVGL（P2 接入）—— 版本**严格对齐** xiaozhi-esp32-1.9.4-gec，两工程同 IDF 5.5.3
  #   lvgl/lvgl            → 实际 9.3.0
  #   espressif/esp_lvgl_port → 实际 2.6.3
  # 说明：本项目**不使用** esp_lvgl_port 的 lvgl_port_add_disp()，只用它的
  #       任务/递归锁/tick 三样基础设施，理由见 components/ui_lvgl/ui_lvgl.c 顶部注释。
  # ==========================================================================
  lvgl/lvgl:
    version: '~9.3.0'
  espressif/esp_lvgl_port:
    version: '~2.6.0'

  # 中文字体（普惠体 20px 等）。P2 初期先用完整字库把屏点起来，
  # 等鱼缸界面文案定稿后再用 lv_font_conv 按需裁剪（体积可从 MB 级降到百 KB 级）。
  # 注：它**不参与 LVGL 的链接**，由使用方按需 include 对应的字体数组头文件。
  78/xiaozhi-fonts:
    version: '~1.5.2'

  # ==========================================================================
  # 摄像头（P6-a）—— DVP 并口，板上为 OV2640 类模组
  #
  # 版本**对齐** xiaozhi-esp32-1.9.4-gec（它约束 ~2.1.2，实解析 2.1.8）。
  # 关键：**xiaozhi 本身就是用 ESP-IDF v5.5.3 构建的** —— 与本工程同版本，
  #       所以这套驱动 API 组合在 5.5.3 上是跑通过的，不是纸面推断。
  #
  # 它会自动带上 espressif/esp_jpeg（2.1.x 的 public 依赖，用于 JPEG 解码）。
  # ⚠️ 不要手工把 managed_components 拷进来 —— dependencies.lock 与 CHECKSUMS
  #    会对不上，组件管理器下次校验会报错。
  # ==========================================================================
  espressif/esp32-camera:
    version: '~2.1.2'

  # ==========================================================================
  # 语音对话（P7）—— 版本**严格对齐** xiaozhi-esp32-1.9.4-gec
  #
  # xiaozhi 本身就是用 ESP-IDF v5.5.3 构建的，与本工程同版本，
  # 所以这套组件组合在同版本上是跑通过的，不是纸面推断。
  #
  # ⚠️ 调用方注意**内存**：本次接入前实测内部堆余量 38%（129.5KB / 344KB），
  #    而 esp-sr 的 AFE + WakeNet 峰值要吃掉约 100KB。这是一次显式的押注，
  #    以 xiaozhi 在同款板上的可行性为依据；上板后必须盯住 monitor_task 的读数。
  # ==========================================================================

  # Opus 编解码（含 78/esp-opus 本体）。语音上行的格式是
  # **16kHz 单声道 60ms/帧**，由 esp-opus-encoder 的 Wrapper 提供。
  78/esp-opus-encoder:
    version: '~2.4.1'

  # 语音前端 esp-sr（AFE + WakeNet 唤醒词）—— **未采用**。
  #
  # 2026-10-13 上板实测后放弃：本工程内部堆总共只有 337KB，接入 WebSocket
  # 客户端（TLS 会话 + 帧缓冲 + 任务栈）后余量已到 29%，而 AFE + WakeNet 的
  # 峰值要再吃约 100KB。**算术上不够**，与"调优"无关。
  #
  # 改用**按键说话**（xiaozhi 自己就有这条路：`NoAudioProcessor` +
  # `kListeningModeManualStop`），零额外内存开销。
  # partitions.csv 里的 `model` 分区**保留**：占位不耗资源，
  # 将来若有人解决了内存问题（或换更大 RAM 的模组）可以直接启用。
  #
  # espressif/esp-sr:
  #   version: '~2.1.5'

  # WebSocket 客户端 —— **不用** xiaozhi 那个 152KB 的自研实现（78/esp-ml307）。
  # 已逐项核对过：握手需要的四个自定义头（Authorization / Protocol-Version /
  # Device-Id / Client-Id）、二进制帧、wss(TLS) 它全都支持，没有能力缺口。
  espressif/esp_websocket_client:
    version: '*'
